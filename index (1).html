:root{
  --azul:#0092DD;--azul-osc:#005ca9;--amarillo:#fdc533;--verde:#2fac66;--rojo:#e94362;--rosa:#f088b6;--morado:#954B97;
  --negro:#1d1d1b;--gris:#C6C6C6;--gris-t:#6b7480;
  --bg:#f2f8fd;--card:#fff;--linea:#dfe9f2;--azul-cl:#e6f4fc;
  --f-tit:'Fredoka',system-ui,sans-serif;--f-txt:'Montserrat',system-ui,sans-serif;--f-mk:'Permanent Marker','Fredoka',cursive;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--f-txt);background:var(--bg);color:var(--negro);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-tit);margin:0;font-weight:600;line-height:1.1}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
small{color:var(--gris-t)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ── Barra superior ── */
.top{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 10px #00366a33}
.top img{height:24px;display:block}
.top .sp{flex:1}
.back{background:#ffffff26;border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer;flex:none}
.pill{border:0;border-radius:99px;padding:7px 12px;font:600 12px var(--f-txt);display:flex;align-items:center;gap:7px;cursor:pointer;background:#ffffff26;color:#fff}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--verde);display:block;box-shadow:0 0 0 2px #fff6}
.pill.pend i{background:var(--amarillo)} .pill.off i{background:var(--rojo)}
.pill.sync i{animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.25}}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--azul);font:700 16px var(--f-tit);cursor:pointer;flex:none}
.banner{margin:12px 14px 0;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.banner.off{background:#fff3d6;color:#7a5a00}
.banner.hora{background:#fde4ea;color:#9b1c3a}

/* ── Pantalla de roles ── */
.hero{background:var(--azul);color:#fff;padding:calc(34px + env(safe-area-inset-top)) 24px 70px;position:relative;overflow:hidden}
.hero .logo{width:min(250px,70%);display:block;position:relative}
.hero .mk{font-family:var(--f-mk);font-size:30px;margin:26px 0 4px;position:relative;line-height:1.1;color:var(--amarillo);transform:rotate(-2deg);display:inline-block}
.hero p{margin:0;position:relative;font-weight:500;opacity:.95;max-width:300px}
.hero .splash{position:absolute;inset:0;pointer-events:none;opacity:.95}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-34px;position:relative;padding:22px 16px 30px}
.sheet h2{font-size:21px;color:var(--azul);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.sheet .sub{margin:0 0 16px;color:var(--gris-t);font-size:13px}
.rolcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--linea);border-radius:var(--r);padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 3px 0 var(--linea);transition:transform .08s}
.rolcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--linea)}
.rolcard .ic{width:60px;height:60px;flex:none}
.rolcard b{font:600 20px var(--f-tit);display:block;color:var(--negro)}
.rolcard span{font-size:12.5px;color:var(--gris-t);display:block;margin-top:2px}
.rolcard .chev{margin-left:auto;font-size:26px;color:var(--azul);font-family:var(--f-tit)}
.aviso{background:#fff3d6;color:#7a5a00;border-radius:14px;padding:12px;font-size:13px;font-weight:600;margin-bottom:14px}

/* ── Clave ── */
.claveBox{padding:22px 16px}
.claveBox .ic{width:84px;height:84px;display:block;margin:6px auto 10px}
.claveBox h2{text-align:center;font-size:26px;color:var(--azul)}
.claveBox .sub{text-align:center;color:var(--gris-t);margin:6px 0 20px}
.claveIn{display:flex;gap:8px;margin-bottom:10px}
.claveIn input{flex:1;font:600 24px ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;padding:14px;border:2px solid var(--linea);border-radius:14px;background:#fff;text-transform:uppercase;min-width:0}
.claveIn input:focus{outline:0;border-color:var(--azul)}
.claveIn button{border:2px solid var(--linea);background:#fff;border-radius:14px;width:54px;font-size:20px;cursor:pointer}
.err{color:var(--rojo);font-weight:600;font-size:13.5px;min-height:20px;margin:4px 0 10px}

/* ── Botones ── */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:600 17px var(--f-tit);background:var(--azul);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--azul-osc);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--azul-osc)}
.btn[disabled]{background:var(--gris);box-shadow:0 3px 0 #a9a9a9;cursor:default;transform:none}
.btn.sec{background:#fff;color:var(--azul);box-shadow:0 3px 0 var(--linea);border:2px solid var(--linea)}
.btn.verde{background:var(--verde);box-shadow:0 3px 0 #1f7f4a}
.btn.amar{background:var(--amarillo);color:var(--negro);box-shadow:0 3px 0 #d9a514}
.btn.rojo{background:var(--rojo);box-shadow:0 3px 0 #b82a47}
.btn.mini{display:inline-block;width:auto;padding:8px 13px;font-size:14px;border-radius:11px}
.row{display:flex;gap:10px}.row>*{flex:1}
.tag{display:inline-block;background:var(--rosa);color:#fff;font:600 13px var(--f-tit);padding:5px 12px;border-radius:9px;letter-spacing:.3px}

/* ── Contenido ── */
.pad{padding:16px 14px}
.titulo{font-size:26px;color:var(--azul);text-transform:uppercase;letter-spacing:.3px;margin:2px 0 4px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--linea);border:1px solid var(--linea)}
.card h3{font-size:18px;margin-bottom:8px}
.vacio{padding:18px;text-align:center;color:var(--gris-t);font-size:13.5px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .sp{flex:1}
.chip{display:inline-block;font:600 11.5px var(--f-tit);padding:3px 9px;border-radius:8px;letter-spacing:.3px;vertical-align:middle}
.chip.gris{background:#eceff3;color:#4b5563}.chip.azul{background:var(--azul-cl);color:var(--azul-osc)}.chip.verde{background:#dff3e8;color:#17794a}.chip.amar{background:#fff0c4;color:#7a5a00}.chip.rojo{background:#fde4ea;color:#9b1c3a}

.lista{display:flex;flex-direction:column;gap:10px}
.item-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:12px 12px;cursor:pointer;box-shadow:0 2px 0 var(--linea)}
.item-card:active{background:var(--azul-cl)}
.item-card b{font:600 18px var(--f-tit);display:block}
.item-card small{display:block;font-size:12.5px}
.item-card .chev{margin-left:auto;font-size:24px;color:var(--azul);font-family:var(--f-tit)}
.ring{flex:none}
.ring text{font:600 15px var(--f-tit);fill:var(--negro)}

.bar{height:10px;background:#e8eff6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--azul);transition:width .3s}
.tabs{position:sticky;bottom:0;z-index:15;display:flex;background:#fff;border-top:1px solid var(--linea);padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;gap:6px}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 6px;font:600 14px var(--f-tit);color:var(--gris-t);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:26px;height:26px}
.tabs button.on{background:var(--azul-cl);color:var(--azul)}

/* ── Cuadrilla ── */
.cuadHead{background:var(--azul);color:#fff;padding:16px 16px 22px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
.cuadHead h1{font-size:30px;text-transform:uppercase;letter-spacing:.3px}
.cuadHead .fam{font:500 16px var(--f-txt);opacity:.95;margin-top:2px}
.cuadHead .gente{margin-top:10px;font-size:12.5px;opacity:.95;line-height:1.55}
.cuadHead .gente b{font-weight:700}
.cuadHead .splash{position:absolute;inset:0;pointer-events:none}
.corte{display:inline-block;margin-top:10px;background:#ffffff2b;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600;position:relative}
.corte.ok{background:#d8f3e4;color:#126b3f}.corte.warn{background:#fff0c4;color:#7a5a00}.corte.mal{background:#fde4ea;color:#9b1c3a}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer;color:#fff;font-family:var(--f-tit)}
.big b{display:block;font-size:22px;font-weight:600}.big span{display:block;font-size:13px;font-weight:400;font-family:var(--f-txt);opacity:.95;margin-top:2px}
.big svg{width:46px;height:46px;flex:none}
.big.a{background:var(--azul);box-shadow:0 4px 0 var(--azul-osc)}
.big.b{background:var(--verde);box-shadow:0 4px 0 #1f7f4a}
.big:active{transform:translateY(2px)}

/* ── Checklist ── */
.etapa{padding:0;overflow:hidden}
.etapaH{display:flex;align-items:center;gap:10px;padding:12px 14px}
.etapaH h3{margin:0;font-size:17px;letter-spacing:.4px}
.etapaH .pc{margin-left:auto;font:600 16px var(--f-tit)}
.etapa .bar{border-radius:0;height:6px}
.item{padding:12px 14px;border-top:1px solid var(--linea);position:relative}
.item.chg{background:#fffbe9;box-shadow:inset 4px 0 0 var(--amarillo)}
.chk{display:flex;gap:12px;align-items:flex-start}
.cbx{flex:none;width:34px;height:34px;border-radius:11px;border:3px solid var(--gris);background:#fff;color:transparent;font:700 20px var(--f-tit);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cbx.on{background:var(--verde);border-color:var(--verde);color:#fff}
.cbx[disabled]{opacity:.55;cursor:default}
.it-t{font-weight:600;font-size:14.5px}
.it-s{display:block;font-size:12px;color:var(--gris-t);margin-top:2px}
.it-s.ok{color:#17794a;font-weight:600}
.it-top{display:flex;align-items:baseline;gap:8px}
.it-top .it-c{margin-left:auto;font:600 17px var(--f-tit)}
.item .bar{margin:8px 0;height:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{flex:none;width:46px;height:46px;border-radius:13px;border:0;background:var(--azul-cl);color:var(--azul-osc);font:600 28px var(--f-tit);cursor:pointer;line-height:1}
.stepper button:active{background:#cbe8f8}
.stepper input{width:72px;text-align:center;font:600 22px var(--f-tit);border:2px solid var(--linea);border-radius:12px;height:46px;background:#fff;-moz-appearance:textfield;padding:0}
.stepper input::-webkit-inner-spin-button{display:none}
.stepper input:focus{outline:0;border-color:var(--azul)}
.stepper .de{color:var(--gris-t);font-weight:600}
.stepper .todo{width:auto;padding:0 12px;font:600 14px var(--f-tit);background:#dff3e8;color:#17794a;margin-left:auto}
.notaBtn{border:0;background:transparent;color:var(--azul);font:600 12.5px var(--f-txt);padding:6px 0 0;cursor:pointer}
.nota{display:block;margin-top:8px;background:#fff6d6;border-radius:10px;padding:8px 10px;font-size:13px;color:#5a4400;cursor:pointer;white-space:pre-wrap;word-break:break-word}
textarea.notaIn{width:100%;margin-top:8px;border:2px solid var(--linea);border-radius:12px;padding:9px 10px;font:14px var(--f-txt);min-height:64px;resize:vertical}
textarea.notaIn:focus{outline:0;border-color:var(--azul)}
.savebar{position:sticky;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--linea);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;box-shadow:0 -4px 14px #00366a14}
.savebar span{flex:1;font-size:13px;font-weight:600;color:var(--gris-t)}
.savebar span.hay{color:#7a5a00}
.savebar .btn{width:auto;padding:13px 20px;flex:none}

/* ── Ver avance ── */
.resumen{display:flex;align-items:center;gap:16px}
.resumen .dato{flex:1}
.resumen .dato div{margin:3px 0;font-size:13px}.resumen .dato b{font-weight:700}
.chartWrap{overflow-x:auto;margin:0 -4px}
.chartWrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
.chartWrap text{font-family:var(--f-txt)}
.cdet{background:var(--azul-cl);border-radius:14px;padding:11px 12px;margin-top:8px;font-size:13px}
.cdet b{font-family:var(--f-tit);font-size:15px;font-weight:600}
.cdet ul{margin:6px 0 0;padding-left:18px}
.cdet li{margin:2px 0}
.hito{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.hito i{width:12px;height:12px;transform:rotate(45deg);border-radius:3px;flex:none}
.bit{padding:10px 0;border-top:1px solid var(--linea);font-size:13px}
.bit:first-of-type{border-top:0}
.bit .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bit .h b{font:600 15px var(--f-tit)}
.bit ul{margin:5px 0 0;padding-left:18px}
.estItem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--linea);font-size:13.5px}
.estItem:first-of-type{border-top:0}
.estItem .m{flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 14px var(--f-tit);background:#eceff3;color:#8a929c}
.estItem .m.ok{background:var(--verde);color:#fff}.estItem .m.mid{background:var(--amarillo);color:var(--negro)}
.estItem .c{margin-left:auto;font:600 15px var(--f-tit);white-space:nowrap}

/* ── Formularios y modales ── */
.fld{margin-bottom:12px}
.fld label{display:block;font:600 12.5px var(--f-txt);color:var(--gris-t);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select{width:100%;padding:13px;border:2px solid var(--linea);border-radius:12px;font:500 16px var(--f-txt);background:#fff}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--azul)}
.fld .ro{padding:13px;background:#eef3f8;border-radius:12px;font-weight:600;color:var(--gris-t)}
.modal{position:fixed;inset:0;z-index:50;background:#0a233a8c;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.5}}
.modal h2{font-size:23px;color:var(--azul);margin-bottom:14px;text-transform:uppercase}
.claveGrande{font:700 34px ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;text-align:center;background:var(--azul-cl);color:var(--azul-osc);border-radius:16px;padding:18px 8px;margin:6px 0 14px}
.persona{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.persona.off{opacity:.55}
.persona b{font:600 17px var(--f-tit)}
.persona .k{font:700 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;color:var(--azul-osc);background:var(--azul-cl);border-radius:9px;padding:4px 8px}
.acc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;width:100%}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--negro);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cargando{text-align:center;padding:50px 20px;color:var(--gris-t)}
.cargando .ic{width:70px;height:70px;animation:giro 1.4s ease-in-out infinite}
@keyframes giro{50%{transform:translateY(-8px)}}
</style>

/* ════════════════════════ UTILIDADES ════════════════════════ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pct = x => Math.round(x * 100);
const unico = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const hhmm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const fmtDH = ms => { const d = new Date(ms); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} · ${hhmm(d)}`; };
const fmtDia = ms => { const d = new Date(ms); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
function hace(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'hace un momento';
  if (m < 60) return `hace ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return `hace ${h} h${r ? ' ' + r + ' min' : ''}`;
  return `hace ${Math.floor(h / 24)} d`;
}
const parseDia = s => { const [y, m, d] = String(s || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const claveDia = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function fmtObra(c) {
  const a = parseDia(c.sabado), b = parseDia(c.domingo);
  if (!a) return '';
  if (!b) return `${DIAS[a.getDay()]} ${a.getDate()} ${MESES[a.getMonth()]} ${a.getFullYear()}`;
  const mes = a.getMonth() === b.getMonth() ? '' : ' ' + MESES[a.getMonth()];
  return `${DIAS[a.getDay()]} ${a.getDate()}${mes} – ${DIAS[b.getDay()]} ${b.getDate()} ${MESES[b.getMonth()]} ${b.getFullYear()}`;
}
function proximoSabado() { const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7)); return claveDia(d); }
function sumarDia(s, n) { const d = parseDia(s); if (!d) return ''; d.setDate(d.getDate() + n); return claveDia(d); }
const esDiaObra = c => { const h = claveDia(new Date()); return !!c && (h === c.sabado || h === c.domingo); };

  casa:       () => svgIc(`<path d="M8 30 32 8l24 22Z" fill="${A}" stroke="none"/><path d="M12 28v28h40V28"/><path d="M27 56V40h10v16"/>`),
  grafica:    () => svgIc(`<rect x="38" y="14" width="12" height="40" fill="${A}" stroke="none"/><path d="M10 54h46M16 54V34M30 54V24M44 54V14"/>`),
  personas:   () => svgIc(`<path d="M6 54a14 14 0 0 1 28 0Z" fill="${A}" stroke="none"/><circle cx="20" cy="22" r="9" fill="#fff"/><path d="M38 38a12 12 0 0 1 20 10v6H44"/><circle cx="46" cy="24" r="7" fill="#fff"/>`),

};

function salpicadura(w, h, n, seed, color, ox = 0.82, oy = 0.3) {
  let s = seed; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const R = Math.min(w, h) * 0.55; let out = '';
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2, d = Math.pow(r(), 1.5) * R;
    const x = w * ox + Math.cos(a) * d * 1.15, y = h * oy + Math.sin(a) * d;
    const rad = Math.max(0.9, (1 - d / R) * 6.5 * r() + 0.8);
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}"/>`;
  }
  return `<svg class="splash" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" fill="${color}" aria-hidden="true">${out}</svg>`;
}

/* ════════════════════════ RED Y SINCRONIZACIÓN ════════════════════════ */
async function api(accion, extra = {}, clave) {
  if (CONFIG.URL_SCRIPT.indexOf('PEGA_') === 0) throw new Error('Falta configurar la URL del servidor (URL_SCRIPT).');
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(CONFIG.URL_SCRIPT, {
      method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, redirect: 'follow', signal: ctrl.signal,
      body: JSON.stringify(Object.assign({accion, clave: clave || (S.sesion && S.sesion.clave)}, extra))
    });
    return await r.json();
  } catch (e) {
    const err = new Error('No se pudo conectar con el servidor. Revisa tu internet.'); err.red = true; throw err;
  } finally { clearTimeout(to); }
}

function aplicarDatos(j) {
  S.datos = j.datos;
  S.sesion.usuario = j.usuario;
  S.claves = {};
  if (j.usuario.rol === 'promotoria') j.datos.personas.forEach(p => { if (p.clave) S.claves[p.id] = p.clave; });
  const copia = JSON.parse(JSON.stringify(j.datos)); copia.personas.forEach(p => { delete p.clave; });
  lsSet('techo_sesion', {clave: S.sesion.clave, usuario: j.usuario});
  lsSet('techo_cache', {usuario: j.usuario, datos: copia, ts: Date.now()});
  if (j.ahora) S.skew = Date.parse(j.ahora) - Date.now();
}

async function sincronizar(manual = false) {
  if (!S.sesion || S.syncing) return;
  S.online = navigator.onLine;
  if (!S.online) { if (manual) toast('Sin conexión. Se subirá solo al reconectar.'); pintarPill(); return; }
  S.syncing = true; pintarPill();
  const enviados = S.cola.slice();
  try {
    const j = await api(enviados.length ? 'sync' : 'datos', {cortes: enviados});
    if (j.ok) {
      const ids = new Set(enviados.map(c => c.id));
      S.cola = S.cola.filter(c => !ids.has(c.id)); lsSet('techo_cola', S.cola);
      aplicarDatos(j); S.ultimoSync = Date.now(); S.errSync = '';
      if (j.extra && j.extra.rechazados) toast('Algunos cambios no se guardaron: no tienes permiso para esos puntos.', 4200);
      else if (manual) toast(enviados.length ? '¡Cortes subidos!' : 'Todo al día');
    } else if (j.code === 'AUTH') {
      salir(true, 'Tu acceso ya no es válido. Pídele a Promotoría una clave nueva.');
      return;
    } else { S.errSync = j.error || 'Error del servidor'; if (manual) toast(S.errSync, 4000); }
  } catch (e) { S.errSync = e.message; if (manual) toast(e.message, 3500); }
  S.syncing = false; pintarPill(); refrescarVista();
}

/* ════════════════════════ CÁLCULOS DE AVANCE ════════════════════════ */
const pctItem = (it, v) => Math.min(Math.max(v || 0, 0), it.total) / it.total;
const pctEtapa = (e, est) => e.items.reduce((s, i) => s + pctItem(ITEM[i.k], est[i.k] && est[i.k].v), 0) / e.items.length;
const pctTotal = est => ITEMS.reduce((s, it) => s + pctItem(it, est[it.k] && est[it.k].v), 0) / ITEMS.length;

function eventosCuad(id) {
  const base = (S.datos ? S.datos.avance : []).filter(e => e.q === id);
  const ids = new Set(base.map(e => e.id));
  const pend = [];
  S.cola.forEach(c => { if (c.q !== id) return; c.items.forEach(it => { const eid = c.id + ':' + it.k; if (!ids.has(eid)) pend.push({id:eid, c:c.id, ts:c.ts, q:id, k:it.k, v:it.v, t:it.t, n:it.n || '', a:(usuario() || {}).nombre, r:rol(), pend:true}); }); });
  return base.concat(pend).sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
}

function analizar(id) {
  const ev = eventosCuad(id), mapa = new Map();
  ev.forEach(e => { if (!mapa.has(e.c)) mapa.set(e.c, {id:e.c, ts:e.ts, ms:Date.parse(e.ts), autor:e.a, rol:e.r, pend:!!e.pend, ev:[]}); mapa.get(e.c).ev.push(e); });
  const cortes = [...mapa.values()].sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.id < b.id ? -1 : 1);
  const est = {}, completo = {}, previo = {};
  CHECKLIST.forEach(e => previo[e.id] = 0);
  cortes.forEach(c => {
    c.cambios = [];
    c.ev.forEach(e => {
      const it = ITEM[e.k]; if (!it) return;
      const antes = est[e.k] ? est[e.k].v : 0, notaAntes = est[e.k] ? est[e.k].n : '';
      est[e.k] = {v:e.v, n:e.n, ts:e.ts, a:e.a};
      c.cambios.push({k:e.k, antes, v:e.v, n:e.n, notaNueva:!!e.n && e.n !== notaAntes});
      if (e.v >= it.total) { if (antes < it.total || !completo[e.k]) completo[e.k] = c.ms; } else delete completo[e.k];
    });
    c.pct = pctTotal(est); c.hitos = [];
    CHECKLIST.forEach(et => { const p = pctEtapa(et, est); if (p >= 1 && previo[et.id] < 1) c.hitos.push(et.id); previo[et.id] = p; });
  });
  const pe = {}; CHECKLIST.forEach(e => pe[e.id] = pctEtapa(e, est));
  return {cortes, est, completo, pct:pctTotal(est), pe, ultimo:cortes.length ? cortes[cortes.length - 1] : null};
}

function descCambios(c) {
  const out = [];
  c.cambios.forEach(x => {
    const it = ITEM[x.k];
    if (it.cont) { if (x.v !== x.antes) out.push(`${esc(it.t)} ${x.antes} → <b>${x.v}/${it.total}</b>`); }
    else if (x.v >= 1 && x.antes < 1) out.push(`✓ ${esc(it.t)}`);
    else if (x.v < 1 && x.antes >= 1) out.push(`↩ ${esc(it.t)} (desmarcado)`);
    if (x.notaNueva) out.push(`<em>Nota en ${esc(it.t)}:</em> “${esc(x.n)}”`);
  });
  return out;
}

const draftDe = id => S.draft[id] || (S.draft[id] = {});
function valorEf(id, k, an) { const d = (S.draft[id] || {})[k]; return d ? d.v : (an.est[k] ? an.est[k].v : 0); }
function notaEf(id, k, an) { const d = (S.draft[id] || {})[k]; return d ? d.n : (an.est[k] ? an.est[k].n : ''); }
function setDraft(id, k, campos, an) {
  const d = draftDe(id), base = an.est[k] || {v:0, n:''};
  const nuevo = Object.assign({v:d[k] ? d[k].v : base.v, n:d[k] ? d[k].n : base.n}, campos);
  if (nuevo.v === base.v && nuevo.n === (base.n || '')) delete d[k]; else d[k] = nuevo;
  if (!Object.keys(d).length) delete S.draft[id];
  lsSet('techo_draft', S.draft);
}

function anillo(p, size = 46, color = '#0092DD') {
  const r = size / 2 - 5, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, p));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e3edf5" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-size:${Math.round(size*0.31)}px">${pct(p)}%</text></svg>`;
}
const chipEtapa = e => `<span class="chip" style="background:${e.color};color:${e.fg}">${e.nombre}</span>`;
const barra = (p, color) => `<div class="bar"><i style="width:${pct(p)}%;${color ? 'background:' + color : ''}"></i></div>`;

function badgeCorte(id) {
  const an = analizar(id), q = cuadrilla(id), c = q && construccion(q.construccion);
  if (!an.ultimo) return `<span class="corte ${esDiaObra(c) ? 'warn' : ''}">Aún sin cortes</span>`;
  const min = (Date.now() - an.ultimo.ms) / 60000;
  const cls = esDiaObra(c) ? (min <= CONFIG.CORTE_CADA_MIN * 0.75 ? 'ok' : min <= CONFIG.CORTE_CADA_MIN * 1.5 ? 'warn' : 'mal') : '';
  const aviso = cls === 'mal' ? ' · ¡toca un corte!' : '';
  return `<span class="corte ${cls}">Último corte ${hace(an.ultimo.ms)}${aviso}</span>`;
}

function topbar(titulo, atras) {

}
function pintarPill() {
  const el = document.getElementById('pill'); if (!el) return;

  if (S.syncing) { cls += ' sync'; txt = 'Sincronizando…'; }

  else if (n) { cls += ' pend'; txt = `${n} por subir`; }
  else txt = 'En línea';
  el.className = cls; el.innerHTML = `<i></i>${txt}`;
}

function filaItem(qid, it, an, esLider) {
  const v = valorEf(qid, it.k, an), nota = notaEf(qid, it.k, an), cambiado = !!(S.draft[qid] && S.draft[qid][it.k]);
  const abierta = !!S.ui.nota[qid + ':' + it.k];
  const guardado = an.est[it.k];
  const terminado = an.completo[it.k];
  const bloqueado = it.soloMonitor && esLider;
  const notaHTML = abierta
    ? `<textarea class="notaIn" data-inp="nota" data-k="${it.k}" placeholder="Escribe una nota…" maxlength="500">${esc(nota)}</textarea>`
    : nota ? `<span class="nota" data-act="nota" data-k="${it.k}">${esc(nota)}</span>` : `<button class="notaBtn" data-act="nota" data-k="${it.k}">＋ nota</button>`;
  const sub = terminado && !cambiado ? `<span class="it-s ok">✓ Listo · ${fmtDH(terminado)}</span>` : (bloqueado ? `<span class="it-s">🔒 Lo marca tu monitor</span>` : '');
  if (!it.cont) {
    return `<div class="item ${cambiado ? 'chg' : ''}"><div class="chk"><button class="cbx ${v >= 1 ? 'on' : ''}" data-act="toggle" data-k="${it.k}" aria-pressed="${v >= 1}" aria-label="${esc(it.t)}" ${bloqueado ? 'disabled' : ''}>✓</button><div style="flex:1;min-width:0"><span class="it-t">${esc(it.t)}</span>${sub}${bloqueado && !nota ? '' : notaHTML}</div></div></div>`;
  }
  return `<div class="item ${cambiado ? 'chg' : ''}"><div class="it-top"><span class="it-t">${esc(it.t)}</span><span class="it-c" data-c="${it.k}">${v}/${it.total}</span></div>${barra(v / it.total, ETAPA[it.etapa].color)}
  <div class="stepper"><button data-act="menos" data-k="${it.k}" aria-label="Quitar uno">−</button><input type="number" inputmode="numeric" min="0" max="${it.total}" value="${v}" data-inp="n" data-k="${it.k}" aria-label="${esc(it.t)}"><span class="de">/ ${it.total}</span><button data-act="mas" data-k="${it.k}" aria-label="Sumar uno">+</button>${v < it.total ? `<button class="todo" data-act="todo" data-k="${it.k}">Todo</button>` : ''}</div>${sub}${notaHTML}</div>`;
}

/* ── Ver avance ── */
function graficaAvance(an, selId) {
  const cortes = an.cortes;
  if (!cortes.length) return `<div class="vacio">Aún no hay cortes.<br>Al guardar el primero verás aquí la gráfica.</div>`;
  const W = Math.max(290, Math.min(window.innerWidth || 400, 560) - 56), H = 250, L = 38, R = 10, T = 22, B = 50;
  const pw = W - L - R, ph = H - T - B;
  const pts = [{ms:cortes[0].ms - 30 * 60000, pct:0, ini:true}].concat(cortes);
  const dk = ms => claveDia(new Date(ms));
  const hr = ms => { const d = new Date(ms); return d.getHours() + d.getMinutes() / 60; };
  const segs = [];
  pts.forEach(p => { const k = dk(p.ms); let s = segs.find(z => z.k === k); if (!s) { s = {k, min:p.ms, max:p.ms}; segs.push(s); } s.min = Math.min(s.min, p.ms); s.max = Math.max(s.max, p.ms); });
  segs.sort((a, b) => a.min - b.min);
  segs.forEach(s => { let h0 = Math.floor(hr(s.min) - 0.1), h1 = Math.ceil(hr(s.max) + 0.1); h0 = Math.max(0, h0); if (h1 - h0 < 3) { h1 = h0 + 3; if (h1 > 24) { h1 = 24; h0 = 21; } } s.h0 = h0; s.h1 = h1; s.span = h1 - h0; });
  const gap = segs.length > 1 ? 16 : 0, avail = pw - gap * (segs.length - 1), tot = segs.reduce((a, s) => a + s.span, 0);
  let x = L; segs.forEach(s => { s.x0 = x; s.w = avail * s.span / tot; s.x1 = x + s.w; x = s.x1 + gap; });
  const segDe = ms => segs.find(z => z.k === dk(ms));
  const X = ms => { const s = segDe(ms); return s.x0 + (hr(ms) - s.h0) / s.span * s.w; };
  const Y = p => T + ph * (1 - p);
  let g = '';
  segs.forEach((s, i) => { g += `<rect x="${s.x0.toFixed(1)}" y="${T}" width="${s.w.toFixed(1)}" height="${ph}" fill="${i % 2 ? '#eaf4fb' : '#f3f9fd'}" rx="6"/>`; });
  [0, .25, .5, .75, 1].forEach(p => { const y = Y(p).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#d4e2ee" stroke-width="1"/><text x="${L - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#6b7480">${p * 100}%</text>`; });
  const linea = []; let pp = 0, ps = null;
  pts.forEach(p => { const s = segDe(p.ms); if (ps && s !== ps) { linea.push([ps.x1, Y(pp)], [s.x0, Y(pp)]); } linea.push([X(p.ms), Y(p.pct)]); pp = p.pct; ps = s; });
  const base = Y(0).toFixed(1);
  g += `<polygon points="${linea[0][0].toFixed(1)},${base} ${linea.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')} ${linea[linea.length - 1][0].toFixed(1)},${base}" fill="#0092DD" opacity=".16"/>`;
  g += `<polyline points="${linea.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="#0092DD" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  for (let i = 0; i < segs.length - 1; i++) g += `<rect x="${segs[i].x1.toFixed(1)}" y="${T - 4}" width="${gap}" height="${ph + 8}" fill="#fff"/><path d="M${(segs[i].x1 + gap / 2).toFixed(1)} ${T} v${ph}" stroke="#c3d3e0" stroke-dasharray="3 4"/>`;
  segs.forEach(s => {
    const step = s.span <= 6 ? 1 : s.span <= 12 ? 2 : 3;
    for (let h = Math.ceil(s.h0); h <= s.h1; h += step) { const xx = (s.x0 + (h - s.h0) / s.span * s.w).toFixed(1); g += `<line x1="${xx}" x2="${xx}" y1="${T + ph}" y2="${T + ph + 4}" stroke="#9fb3c4"/><text x="${xx}" y="${T + ph + 16}" text-anchor="middle" font-size="10" fill="#6b7480">${h}:00</text>`; }
    const nombreDia = fmtDia(s.min), cx = (s.x0 + s.w / 2).toFixed(1);
    g += `<rect x="${(+cx - 38).toFixed(1)}" y="${T + ph + 24}" width="76" height="19" rx="7" fill="#f088b6"/><text x="${cx}" y="${T + ph + 37.5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" style="font-family:var(--f-tit)">${nombreDia}</text>`;
  });
  cortes.forEach(c => {
    const cx = X(c.ms), cy = Y(c.pct), sel = c.id === selId;
    c.hitos.forEach((h, j) => { const e = ETAPA[h]; g += `<rect x="${(cx - 5 + j * 11).toFixed(1)}" y="${(cy - 22).toFixed(1)}" width="10" height="10" rx="2.5" fill="${e.color}" stroke="#fff" stroke-width="1.5" transform="rotate(45 ${(cx + j * 11).toFixed(1)} ${(cy - 17).toFixed(1)})"/>`; });
    g += `<g data-act="sel-corte" data-id="${esc(c.id)}" style="cursor:pointer"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="16" fill="transparent"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${sel ? 7.5 : 5}" fill="${sel ? '#fdc533' : '#fff'}" stroke="${c.pend ? '#e94362' : '#0092DD'}" stroke-width="3"/></g>`;
    if (sel) g += `<text x="${Math.min(Math.max(cx, L + 16), W - R - 16).toFixed(1)}" y="${(cy - (c.hitos.length ? 28 : 12)).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#005ca9">${pct(c.pct)}%</text>`;
  });
  return `<div class="chartWrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Avance en el tiempo">${g}</svg></div>`;
}

function vistaAvance(v) {
  const q = cuadrilla(v.id); if (!q) return topbar('', true) + `<div class="vacio">No se encontró la cuadrilla.</div>`;
  const an = analizar(q.id), cortes = an.cortes;
  const selId = S.ui.corteSel[q.id] && cortes.some(c => c.id === S.ui.corteSel[q.id]) ? S.ui.corteSel[q.id] : (an.ultimo ? an.ultimo.id : '');
  const sel = cortes.find(c => c.id === selId);
  const idx = sel ? cortes.indexOf(sel) : -1, antes = idx > 0 ? cortes[idx - 1].pct : 0;
  const nNotas = Object.keys(an.est).filter(k => an.est[k].n).length;
  const hitos = []; cortes.forEach(c => c.hitos.forEach(h => hitos.push({h, ms:c.ms})));
  const det = sel ? `<div class="cdet"><b>${fmtDH(sel.ms)}</b> · ${esc(sel.autor || '')} <small>(${ROLES[sel.rol] ? ROLES[sel.rol].nombre : ''})</small>${sel.pend ? ' <span class="chip rojo">por subir</span>' : ''}<div style="margin-top:3px">Avance: ${pct(antes)}% → <b>${pct(sel.pct)}%</b></div>${(() => { const d = descCambios(sel); return d.length ? `<ul>${d.map(x => `<li>${x}</li>`).join('')}</ul>` : ''; })()}</div>` : '';
  const bit = cortes.slice().reverse();
  const verBit = S.ui.bitTodo ? bit : bit.slice(0, 6);
  return topbar('', true) + `<div class="pad"><span class="tag">Ver avance</span><h1 class="titulo" style="margin-top:8px">${esc(q.nombre)}</h1><small>${esc(q.familia || '')}</small>
  <div class="card" style="margin-top:12px"><div class="resumen">${anillo(an.pct, 92)}<div class="dato"><div style="font:600 18px var(--f-tit)">Avance total</div><div>${an.ultimo ? `Último corte: <b>${fmtDH(an.ultimo.ms)}</b>` : 'Aún sin cortes'}</div><div><b>${cortes.length}</b> corte${cortes.length === 1 ? '' : 's'} · <b>${nNotas}</b> nota${nNotas === 1 ? '' : 's'}</div></div></div></div>
  <div class="card"><h3>Avance en el tiempo</h3>${graficaAvance(an, selId)}${cortes.length ? '<small>Toca un punto para ver ese corte.</small>' : ''}${det}</div>
  ${hitos.length ? `<div class="card"><h3>Etapas terminadas</h3>${hitos.map(x => `<div class="hito"><i style="background:${ETAPA[x.h].color}"></i><b style="font-family:var(--f-tit)">${ETAPA[x.h].nombre}</b><span style="margin-left:auto;color:var(--gris-t)">${fmtDH(x.ms)}</span></div>`).join('')}</div>` : ''}
  ${CHECKLIST.map(e => {
    return `<div class="card"><div class="hrow">${chipEtapa(e)}<span class="sp"></span><b style="font:600 17px var(--f-tit)">${pct(an.pe[e.id])}%</b></div><div style="margin:8px 0 4px">${barra(an.pe[e.id], e.color)}</div>${e.items.map(i => {
      const it = ITEM[i.k], st = an.est[i.k], val = st ? st.v : 0, ok = val >= it.total, mid = val > 0 && !ok;
      return `<div class="estItem"><span class="m ${ok ? 'ok' : mid ? 'mid' : ''}">${ok ? '✓' : mid ? '…' : '·'}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(it.t)}</div>${ok && an.completo[i.k] ? `<small>Terminado ${fmtDH(an.completo[i.k])}</small>` : st ? `<small>Actualizado ${fmtDH(Date.parse(st.ts))}</small>` : `<small>Pendiente</small>`}${st && st.n ? `<span class="nota" style="cursor:default">${esc(st.n)}</span>` : ''}</div>${it.cont ? `<span class="c">${val}/${it.total}</span>` : ''}</div>`;
    }).join('')}</div>`;
  }).join('')}
  <div class="card"><h3>Bitácora de cortes</h3>${verBit.length ? verBit.map(c => { const d = descCambios(c); return `<div class="bit"><div class="h"><b>${fmtDH(c.ms)}</b><span>${esc(c.autor || '')}</span><span class="chip azul">${pct(c.pct)}%</span>${c.pend ? '<span class="chip rojo">por subir</span>' : ''}</div>${d.length ? `<ul>${d.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>`; }).join('') + (bit.length > 6 && !S.ui.bitTodo ? `<button class="btn mini sec" style="margin-top:8px" data-act="bit-todo">Ver todos (${bit.length})</button>` : '') : '<div class="vacio">Sin cortes todavía.</div>'}</div>
  <button class="btn" data-act="actualizar" data-id="${q.id}">Actualizar avance</button></div>`;
}

/* ════════════════════════ RENDER Y NAVEGACIÓN ════════════════════════ */
let _lastKey = '', _scroll = 0;
function render() {
  const v = cur(), key = v.name + (v.id || '') + (v.rol || '') + S.tab;
  const y = key === _lastKey ? window.scrollY : 0;
  const vistas = {roles:vistaRoles, clave:vistaClave, home:vistaHome, construccion:vistaConstruccion, cuadrilla:vistaCuadrilla, actualizar:vistaActualizar, avance:vistaAvance};
  let html;
  try { html = (vistas[v.name] || vistaRoles)(v); }
  catch (e) { console.error(e); html = `<div class="pad"><div class="card">Ocurrió un error al mostrar esta pantalla.<br><small>${esc(e.message)}</small></div><button class="btn" data-act="atras">Volver</button></div>`; }
  app.innerHTML = html + modalHTML();
  _lastKey = key;
  window.scrollTo(0, y);
  pintarPill();
  if (v.name === 'clave' && !S.modal) { const i = document.getElementById('clave'); if (i) i.focus(); }
}
function refrescarVista() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (S.modal && S.modal.tipo !== 'cuenta') return;
  if (S.sesion) render();
}
function go(name, params = {}) { S.nav.push(Object.assign({name}, params)); history.pushState({d: S.nav.length}, ''); S.ui.bitTodo = false; render(); }
function atras() { if (S.nav.length > 1) history.back(); }
window.addEventListener('popstate', () => { if (S.modal) { S.modal = null; } if (S.nav.length > 1) S.nav.pop(); render(); });
window.addEventListener('resize', (() => { let t; return () => { clearTimeout(t); t = setTimeout(() => { if (cur().name === 'avance') render(); }, 200); }; })());

/* ════════════════════════ ACCIONES ════════════════════════ */
async function entrar() {
  const v = cur(), inp = document.getElementById('clave'), err = document.getElementById('err'), btn = document.getElementById('btnEntrar');
  const clave = (inp.value || '').trim();
  if (clave.replace(/[^A-Za-z0-9]/g, '').length < 6) { err.textContent = 'Escribe tu clave completa.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const j = await api('login', {rol: v.rol}, clave);
    if (!j.ok) { err.textContent = j.error || 'No se pudo entrar.'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
    S.sesion = {clave, usuario:j.usuario}; S.cola = lsGet('techo_cola', []); S.draft = lsGet('techo_draft', {});
    aplicarDatos(j); S.ultimoSync = Date.now();
    S.nav = [{name:'home'}]; S.tab = 'cons'; history.replaceState({d: 1}, '');
    render(); toast(`¡Hola, ${j.usuario.nombre.split(' ')[0]}!`);
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar'; }
}

function salir(forzado, msg) {
  if (!forzado && S.cola.length && !confirm(`Tienes ${S.cola.length} corte(s) sin subir. Si cierras sesión se perderán. ¿Cerrar sesión de todos modos?`)) return;
  ['techo_sesion', 'techo_cache', 'techo_cola', 'techo_draft'].forEach(lsDel);
  Object.assign(S, {sesion:null, datos:null, claves:{}, cola:[], draft:{}, modal:null, nav:[{name:'roles'}], syncing:false});
  history.replaceState({d: 1}, ''); render();
  if (msg) toast(msg, 5000);
}

function guardarCorte(id) {
  const d = S.draft[id]; if (!d || !Object.keys(d).length) return;
  const items = Object.keys(d).map(k => ({k, v:d[k].v, t:ITEM[k].total, n:d[k].n || ''}));
  const corte = {id: `${id}-${unico()}`, q:id, ts:new Date().toISOString(), items};
  S.cola.push(corte); lsSet('techo_cola', S.cola);
  delete S.draft[id]; lsSet('techo_draft', S.draft);
  S.ui.nota = {};
  render();
  toast(navigator.onLine ? `Corte guardado · ${fmtDH(Date.parse(corte.ts))}` : `Corte guardado en el teléfono · ${fmtDH(Date.parse(corte.ts))}. Se subirá al reconectar.`, 3600);
  if (navigator.onLine) sincronizar();
}

function actualizarBarra(id) {
  const n = nCambios(id), t = document.getElementById('sbTxt'), b = document.getElementById('sbBtn');
  if (t) { t.textContent = n ? `${n} cambio${n === 1 ? '' : 's'} sin guardar` : 'Sin cambios por guardar'; t.className = n ? 'hay' : ''; }
  if (b) b.disabled = !n;
}

async function adminOp(op, registro) {
  if (!navigator.onLine) throw new Error('Necesitas internet para guardar esto.');
  const j = await api('admin', {op, registro});
  if (!j.ok) { if (j.code === 'AUTH') salir(true, 'Tu acceso ya no es válido.'); throw new Error(j.error || 'No se pudo guardar.'); }
  aplicarDatos(j); return j.extra || {};
}
const val = id => (document.getElementById(id) || {}).value || '';

async function guardarModal() {
  const m = S.modal, err = document.getElementById('mErr'), btn = document.getElementById('mGuardar');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (m.tipo === 'cons') {
      if (!val('m_comunidad').trim()) throw new Error('Escribe el nombre de la comunidad.');
      const sab = val('m_sabado'); if (!sab) throw new Error('Elige la fecha del sábado.');
      await adminOp('construccion', {id:m.data.id || '', comunidad:val('m_comunidad'), sabado:sab, domingo:sumarDia(sab, 1), notas:val('m_notas'), estado:val('m_estado') || 'activa'});
      S.modal = null; render(); toast('Construcción guardada');
    } else if (m.tipo === 'cuad') {
      if (!val('m_nombre').trim()) throw new Error('Escribe el nombre de la cuadrilla.');
      await adminOp('cuadrilla', {id:m.data.id || '', construccion:m.data.construccion, nombre:val('m_nombre'), familia:val('m_familia'), monitor:val('m_monitor'), lider:val('m_lider'), colider:val('m_colider')});
      S.modal = null; render(); toast('Cuadrilla guardada');
    } else if (m.tipo === 'persona') {
      if (!val('m_nombre').trim()) throw new Error('Escribe el nombre.');
      const extra = await adminOp('persona', {id:m.data.id || '', nombre:val('m_nombre'), rol:val('m_rol'), activo:val('m_activo') || 'SI'});
      if (extra.clave) { const p = persona(extra.id); S.claves[extra.id] = extra.clave; S.modal = {tipo:'clave', data:{id:extra.id, nombre:p ? p.nombre : val('m_nombre'), rol:p ? p.rol : val('m_rol'), clave:extra.clave}}; render(); }
      else { S.modal = null; render(); toast('Persona guardada'); }
    }
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Guardar'; }
}

function mensajeWA(p) {
  const url = location.origin + location.pathname;
  return `Hola ${p.nombre.split(' ')[0]} 👋 Tu clave de acceso a la app de seguimiento de construcción de TECHO es: ${S.claves[p.id]}\n\n1) Abre ${url}\n2) Elige el rol "${ROLES[p.rol].nombre}"\n3) Escribe tu clave.\n\nEs personal, no la compartas.`;
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Copiado ✓'); }
  catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copiado ✓'); } catch (_) { toast('No se pudo copiar'); } t.remove(); }
}

function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k, v = cur();
  if (a === 'fondo') { if (e.target === el && S.modal && S.modal.tipo !== 'cuenta') return; if (e.target === el) { S.modal = null; render(); } return; }
  switch (a) {
    case 'rol': go('clave', {rol:el.dataset.rol}); break;
    case 'ver-clave': { const i = document.getElementById('clave'); i.type = i.type === 'password' ? 'text' : 'password'; break; }
    case 'entrar': entrar(); break;
    case 'atras': atras(); break;
    case 'tab': S.tab = el.dataset.tab; render(); break;
    case 'abrir-cons': go('construccion', {id}); break;
    case 'abrir-cuad': go('cuadrilla', {id}); break;
    case 'actualizar': go('actualizar', {id}); break;
    case 'ver-avance': go('avance', {id}); break;
    case 'sync': sincronizar(true); break;
    case 'sync-cerrar': S.modal = null; render(); sincronizar(true); break;
    case 'menu-user': S.modal = {tipo:'cuenta'}; render(); break;
    case 'salir': S.modal = null; salir(false); break;
    case 'cerrar-modal': S.modal = null; render(); break;
    case 'guardar-modal': guardarModal(); break;
    case 'nueva-cons': S.modal = {tipo:'cons', data:{}}; render(); break;
    case 'editar-cons': S.modal = {tipo:'cons', data:construccion(id)}; render(); break;
    case 'nueva-cuad': S.modal = {tipo:'cuad', data:{construccion:el.dataset.cons}}; render(); break;
    case 'editar-cuad': S.modal = {tipo:'cuad', data:cuadrilla(id)}; render(); break;
    case 'nueva-persona': S.modal = {tipo:'persona', data:{rol:'lider'}}; render(); break;
    case 'editar-persona': S.modal = {tipo:'persona', data:persona(id)}; render(); break;
    case 'regen': {
      if (!confirm('La clave anterior dejará de funcionar. ¿Generar una nueva?')) break;
      const p = persona(id);
      adminOp('regenerarClave', {id}).then(x => { S.claves[id] = x.clave; S.modal = {tipo:'clave', data:{id, nombre:p.nombre, rol:p.rol, clave:x.clave}}; render(); }).catch(er => { const m = document.getElementById('mErr'); if (m) m.textContent = er.message; });
      break; }
    case 'copiar': copiar(S.claves[id] || ''); break;
    case 'copiar-txt': copiar(el.dataset.txt); break;
    case 'wa': { const p = persona(id); if (!p || !S.claves[id]) { toast('Conéctate para ver la clave'); break; } window.open('https://wa.me/?text=' + encodeURIComponent(mensajeWA(p)), '_blank'); break; }
    case 'sel-corte': S.ui.corteSel[v.id] = id; render(); break;
    case 'bit-todo': S.ui.bitTodo = true; render(); break;
    case 'guardar-corte': guardarCorte(id); break;
    case 'toggle': { const an = analizar(v.id), nuevo = valorEf(v.id, k, an) >= 1 ? 0 : 1; setDraft(v.id, k, {v:nuevo}, an); render(); break; }
    case 'mas': case 'menos': { const an = analizar(v.id), it = ITEM[k], cur0 = valorEf(v.id, k, an); setDraft(v.id, k, {v:Math.max(0, Math.min(it.total, cur0 + (a === 'mas' ? 1 : -1)))}, an); render(); break; }
    case 'todo': { const an = analizar(v.id); setDraft(v.id, k, {v:ITEM[k].total}, an); render(); break; }
    case 'nota': { const key = v.id + ':' + k; S.ui.nota[key] = true; render(); const t = app.querySelector(`textarea[data-k="${k}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } break; }
  }
}
function onChange(e) {
  const el = e.target; if (!el.dataset || el.dataset.inp !== 'n') return;
  const v = cur(), it = ITEM[el.dataset.k], an = analizar(v.id);
  let n = parseInt(el.value, 10); if (isNaN(n)) n = valorEf(v.id, it.k, an);
  setDraft(v.id, it.k, {v:Math.max(0, Math.min(it.total, n))}, an); render();
}
function onInput(e) {
  const el = e.target;
  if (el.id === 'clave') { let s = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); el.value = s.length > 4 ? s.slice(0, 4) + '-' + s.slice(4) : s; return; }
  if (el.id === 'm_sabado') { const d = document.getElementById('m_domingo'), p = parseDia(sumarDia(el.value, 1)); if (d && p) d.textContent = fmtDia(p.getTime()); return; }
  if (el.dataset && el.dataset.inp === 'nota') { const v = cur(), an = analizar(v.id); setDraft(v.id, el.dataset.k, {n:el.value.slice(0, 500)}, an); actualizarBarra(v.id); const card = el.closest('.item'); if (card) card.classList.toggle('chg', !!(S.draft[v.id] && S.draft[v.id][el.dataset.k])); }
}
function onKey(e) { if (e.key === 'Enter' && e.target.id === 'clave') entrar(); }

/* ════════════════════════ ARRANQUE ════════════════════════ */
app.addEventListener('click', onClick);
app.addEventListener('change', onChange);
app.addEventListener('input', onInput);
app.addEventListener('keydown', onKey);
window.addEventListener('online', () => { S.online = true; pintarPill(); if (S.sesion) { toast('De vuelta en línea'); sincronizar(); } else render(); });
window.addEventListener('offline', () => { S.online = false; if (S.sesion) render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.sesion && Date.now() - S.ultimoSync > 30000) sincronizar(); });
setInterval(() => { if (!document.hidden && S.sesion && navigator.onLine && Date.now() - S.ultimoSync > 120000) sincronizar(); }, 30000);

(function boot() {
  const ses = lsGet('techo_sesion', null);
  if (ses && ses.clave) {
    S.sesion = ses; const c = lsGet('techo_cache', null);
    if (c && c.datos) { S.datos = c.datos; S.sesion.usuario = c.usuario || ses.usuario; }
    S.cola = lsGet('techo_cola', []); S.draft = lsGet('techo_draft', {});
    S.nav = [{name:'home'}];
  }
  history.replaceState({d: 1}, '');
  render();
  if (S.sesion) sincronizar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
